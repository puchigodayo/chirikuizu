<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>球体地理クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #0b1020; font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', system-ui, sans-serif; }

  #menu-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    background: radial-gradient(ellipse at center, rgba(5,8,18,0.18) 0%, rgba(5,8,18,0.62) 62%, rgba(5,8,18,0.88) 100%);
    z-index: 200; color: #fff;
    transition: opacity 0.8s ease;
    cursor: pointer;
    padding: 0 20px 9vh;
  }
  #menu-screen h1 {
    font-size: clamp(3rem, 11vw, 5.2rem);
    font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    letter-spacing: .06em; margin: 16px 0 10px; font-weight: 600; line-height: 1;
    color: #fff; text-shadow: none;
  }
  #menu-screen h1 span { font-weight: 800; }
  #menu-screen .start-text {
    font-size: 11px; letter-spacing: .12em; color: #64748b; animation: none;
  }
  #menu-screen .loading { font-size: 0.9rem; color: #94a3b8; letter-spacing: 0.1em; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  #menu-screen.hidden { opacity: 0; pointer-events: none; }

  .announce-style {
    position: fixed; top: 0; left: 0; z-index: 100;
    font-weight: 900; font-size: clamp(2rem, 6vw, 4.5rem); line-height: 1;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.9), 0 0 60px rgba(59, 130, 246, 0.4);
    transform-origin: top left; pointer-events: none; white-space: nowrap; max-width: 94vw; overflow: hidden; text-overflow: ellipsis;
    font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    letter-spacing: 0.05em;
  }

  #question-title {
    color: #fff;
    transition: top 0.6s cubic-bezier(0.25, 0.8, 0.25, 1),
                left 0.6s cubic-bezier(0.25, 0.8, 0.25, 1),
                transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
    opacity: 0;
  }
  #question-title.center {
    top: 50vh; left: 50vw;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  #question-title.corner {
    top: 20px; left: 20px;
    transform: translate(0, 0) scale(0.35);
    opacity: 1;
  }
  #question-title.no-transition { transition: none !important; }

  #hint-text {
    color: #fbbf24;
    transition: top 0.6s cubic-bezier(0.25, 0.8, 0.25, 1),
                left 0.6s cubic-bezier(0.25, 0.8, 0.25, 1),
                transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1),
                opacity 0.3s ease;
    opacity: 0;
  }
  #hint-text.center {
    top: 50vh; left: 50vw;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  #hint-text.corner {
    top: 76px; left: 20px;
    transform: translate(0, 0) scale(0.35);
    opacity: 1;
  }
  #hint-text.no-transition { transition: none !important; }

  #center-msg {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    font-size: clamp(1.5rem, 5vw, 4rem); font-weight: 900;
    font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    text-shadow: 0 4px 24px rgba(0,0,0,0.9);
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
    pointer-events: none; z-index: 150; text-align: center; width: 90vw;
    letter-spacing: 0.05em;
  }
  #center-msg.show {
    opacity: 1; transform: translate(-50%, -50%) scale(1);
  }

  #time-gauge-wrap {
    position: fixed; top: 56px; left: 20px;
    width: 180px; height: 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 4px; overflow: hidden; z-index: 100;
    opacity: 0; transition: opacity 0.3s;
  }
  #time-gauge-wrap.active { opacity: 1; }
  #time-gauge {
    height: 100%; width: 100%; background: #4ade80;
    transform-origin: left;
  }

  /* はじめの画面では背景UIをすべて隠し、地球だけを見せる */
  body.in-menu #hud, body.in-menu #time-gauge-wrap, body.in-menu #info-card, body.in-menu #toast { display: none !important; }
  /* 一時停止中は CSS アニメーションも止める */
  body.paused *, body.paused *::before, body.paused *::after { animation-play-state: paused !important; }
  /* --- UI強化: HUD / メニュー / 情報カード / 演出 --- */
  #hud { position: fixed; top: 14px; right: 14px; z-index: 120; display: flex; align-items: center; gap: 8px; }
  .hud-stat { background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 6px 10px; color: #e2e8f0; font-size: 12px; text-align: center; min-width: 56px; backdrop-filter: blur(4px); }
  .hud-stat .hud-label { display: block; font-size: 10px; color: #94a3b8; letter-spacing: .08em; }
  .hud-stat b { font-size: 15px; color: #fff; }
  .hud-stat b.hot { color: #fb923c; }
  .hud-btns { display: flex; gap: 6px; }
  .hud-btns button { width: 36px; height: 36px; border-radius: 2px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.6); color: #fff; cursor: pointer; backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 0; }
  .hud-btns button svg { width: 18px; height: 18px; display: block; }
  #btn-sound .icon-sound-off { display: none; }
  #btn-sound.muted .icon-sound-off { display: block; }
  #btn-sound.muted .icon-sound-on { display: none; }
  .hud-btns button:hover { background: rgba(255,255,255,.18); }
  #time-gauge-wrap { width: min(300px, 42vw); height: auto; background: transparent; overflow: visible; display: flex; align-items: center; gap: 8px; }
  #time-gauge-bar { flex: 1; height: 10px; background: rgba(255,255,255,.2); border-radius: 5px; overflow: hidden; }
  #time-text { color: #fff; font-weight: 800; font-size: 15px; min-width: 2ch; text-align: right; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #time-gauge-wrap.low #time-text { color: #f87171; animation: pulse 0.8s infinite; }
  #center-msg.show { animation: pop .35s ease; }
  @keyframes pop { 0% { transform: translate(-50%,-50%) scale(.8); } 60% { transform: translate(-50%,-50%) scale(1.08); } 100% { transform: translate(-50%,-50%) scale(1); } }
  @keyframes shakeAnim { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-7px,3px); } 40% { transform: translate(6px,-3px); } 60% { transform: translate(-5px,-2px); } 80% { transform: translate(4px,2px); } }
  body.shake { animation: shakeAnim .4s ease; }
  #flash { position: fixed; inset: 0; z-index: 140; pointer-events: none; opacity: 0; transition: opacity .35s; }
  #flash.show { opacity: .28; }
  #toast { position: fixed; bottom: 76px; left: 50%; transform: translate(-50%, 8px); z-index: 150; background: rgba(0,0,0,.75); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #info-card { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 16px); z-index: 130; width: min(520px, 92vw); background: rgba(10,15,30,.88); border: 1px solid rgba(255,255,255,.16); border-radius: 16px; padding: 14px 16px; color: #e2e8f0; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; backdrop-filter: blur(6px); box-shadow: 0 12px 32px rgba(0,0,0,.5); }
  #info-card.show { opacity: 1; transform: translate(-50%, 0); }
  #info-card .info-label { font-size: 11px; letter-spacing: .15em; color: #60a5fa; font-weight: 800; margin-bottom: 2px; }
  #info-card .info-name { font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 8px; }
  #info-card .info-rows { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
  #info-card .info-rows span { color: #94a3b8; margin-right: 6px; }
  #info-card .info-rows b { color: #fff; font-weight: 700; }
  #pause-overlay { position: fixed; inset: 0; z-index: 180; display: none; align-items: center; justify-content: center; background: rgba(5,8,18,.72); backdrop-filter: blur(4px); }
  #pause-overlay.show { display: flex; }
  .pause-card { background: #0f172a; border: 1px solid rgba(255,255,255,.15); border-radius: 4px; padding: 28px 28px; text-align: left; color: #fff; width: min(360px, 90vw); }
  .pause-card h2 { margin: 0 0 6px; font-size: 24px; font-weight: 600; }
  .pause-card p { color: #94a3b8; font-size: 14px; margin: 0 0 18px; }
  .pause-card button { display: block; width: 100%; margin-top: 10px; padding: 12px; border-radius: 2px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; }
  #btn-resume { background: #fff; color: #0b1020; }
  #btn-restart-overlay { background: transparent; border: 1px solid rgba(255,255,255,.3); color: #fff; }
  #btn-menu-overlay { background: transparent; border: 1px solid rgba(255,255,255,.3); color: #fff; }
  #confetti { position: fixed; inset: 0; z-index: 145; pointer-events: none; overflow: hidden; }
  .burst-piece { position: absolute; width: 8px; height: 8px; border-radius: 50%; animation: burst-fly .9s cubic-bezier(.1,.7,.3,1) forwards; }
  @keyframes burst-fly { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  .burst-ring { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 2px solid rgba(74,222,128,.9); border-radius: 50%; animation: ring-expand .8s ease-out forwards; }
  @keyframes ring-expand { to { width: 190px; height: 190px; margin: -95px 0 0 -95px; opacity: 0; } }
  .menu-inner { width: min(560px, 94vw); text-align: left; }
  .menu-eyebrow { font-size: 11px; letter-spacing: .4em; color: #94a3b8; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,.22); padding-bottom: 12px; }
  .menu-sub { color: #cbd5e1; margin: 0 0 26px; font-size: 15px; line-height: 1.6; }
  .howto { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; border-top: 1px solid rgba(255,255,255,.18); padding-top: 16px; margin: 0 0 28px; }
  .howto .step-no { font-size: 11px; letter-spacing: .2em; color: #94a3b8; }
  .howto p { font-size: 13px; color: #e2e8f0; margin: 6px 0 0; line-height: 1.55; }
  .menu-foot { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .menu-btn { width: auto; padding: 14px 30px; border: none; border-radius: 2px; font-size: 15px; font-weight: 700; letter-spacing: .08em; color: #0b1020; background: #fff; cursor: pointer; }
  .menu-btn:hover { background: #e2e8f0; }
  .menu-meta { display: grid; gap: 4px; }
  .menu-best { color: #94a3b8; font-size: 12px; font-weight: 400; }
  .menu-best span { color: #fff; font-weight: 700; }
  @media (max-width: 640px) {
    .hud-stat { min-width: 48px; padding: 5px 7px; }
    .hud-stat .hud-label { display: none; }
    #info-card .info-name { font-size: 19px; }
    .howto { grid-template-columns: 1fr; gap: 10px; }
    #menu-screen { padding-bottom: 6vh; }
  }
</style>
</head>
<body class="in-menu">

<div id="question-title" class="announce-style"></div>
<div id="time-gauge-wrap"><div id="time-gauge-bar"><div id="time-gauge"></div></div><span id="time-text">30</span></div>

<div id="hud">
  <div class="hud-stat"><span class="hud-label">連続</span><b id="stat-streak">0</b></div>
  <div class="hud-stat"><span class="hud-label">正答率</span><b id="stat-acc">—</b></div>

    <button id="btn-sound" type="button" title="音のオン・オフ" aria-label="音のオン・オフ"><svg class="icon-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="icon-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@turf/turf": "https://cdn.jsdelivr.net/npm/@turf/turf@6/+esm",
    "topojson-client": "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as turf from '@turf/turf';
import * as topojson from 'topojson-client';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
camera.position.z = 3.2;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const R = 1;
const maxTexSize = renderer.capabilities.maxTextureSize;
const MAP_W = Math.min(4096, maxTexSize); // 8192だと8192x4096キャンバス2枚で約256MBになり、iOS等で描画失敗するため4096に制限
const MAP_H = MAP_W / 2;

const mapCanvas = document.createElement('canvas');
mapCanvas.width = MAP_W; mapCanvas.height = MAP_H;
const mapCtx = mapCanvas.getContext('2d');

const baseCanvas = document.createElement('canvas');
baseCanvas.width = MAP_W; baseCanvas.height = MAP_H;
const baseCtx = baseCanvas.getContext('2d');

const mapTexture = new THREE.CanvasTexture(mapCanvas);
mapTexture.colorSpace = THREE.SRGBColorSpace;
mapTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

const globe = new THREE.Mesh(
  new THREE.SphereGeometry(R, 96, 48),
  new THREE.MeshBasicMaterial({ map: mapTexture })
);
scene.add(globe);

// 星空と大気のグロー（UI強化）
{
  const starCount = 900;
  const pos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const v = new THREE.Vector3(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1).normalize()
      .multiplyScalar(18 + Math.random() * 35);
    pos.set([v.x, v.y, v.z], i * 3);
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: 0.85 })));
}
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.09, 64, 32),
  new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.12, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false })
);
scene.add(atmosphere);

// ===== グロー用レイヤー =====
const GLOW_W = 2048, GLOW_H = 1024;
const glowCanvas = document.createElement('canvas');
glowCanvas.width = GLOW_W; glowCanvas.height = GLOW_H;
const glowCtx = glowCanvas.getContext('2d');
const glowTexture = new THREE.CanvasTexture(glowCanvas);
glowTexture.colorSpace = THREE.SRGBColorSpace;

const glowMaterial = new THREE.MeshBasicMaterial({
  map: glowTexture,
  transparent: true,
  opacity: 0,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.FrontSide,
});
const glowMesh = new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.004, 64, 32),
  glowMaterial
);
glowMesh.visible = false;
scene.add(glowMesh);

const glowToXY = (lon, lat) => [
  (lon + 180) / 360 * GLOW_W,
  (90 - lat) / 180 * GLOW_H
];

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.3;
controls.maxDistance = 6;
controls.enablePan = false;
// ズーム倍率に応じて回転感度を調整する
const BASE_ROTATE_SPEED = 0.6;
const BASE_CAMERA_DISTANCE = 3.2;

function lonLatToVec3(lon, lat, radius) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
}

function vec3ToLonLat(p) {
  const n = p.clone().normalize();
  const lat = 90 - Math.acos(THREE.MathUtils.clamp(n.y, -1, 1)) * 180 / Math.PI;
  const lon = Math.atan2(-n.z, n.x) * 180 / Math.PI;
  return { lon, lat };
}

const COLORS = { ocean: '#16304d', land: '#4d7a5c', border: '#a5c8f0', correct: '#22c55e', wrong: '#ef4444' };
const toXY = (lon, lat) => [ (lon + 180) / 360 * MAP_W, (90 - lat) / 180 * MAP_H ];

function unwrapRing(ring) {
  if (!ring.length) return [];
  const out = [[ring[0][0], ring[0][1]]];
  for (let i = 1; i < ring.length; i++) {
    let lon = ring[i][0];
    const prev = out[out.length - 1][0];
    while (lon - prev > 180) lon -= 360;
    while (lon - prev < -180) lon += 360;
    out.push([lon, ring[i][1]]);
  }
  return out;
}

function getPolygons(geom) {
  if (!geom) return [];
  if (geom.type === 'Polygon') return [geom.coordinates];
  if (geom.type === 'MultiPolygon') return geom.coordinates;
  return [];
}

function pathRing(ctx, ring, xyFn) {
  const u = unwrapRing(ring);
  let minLat = Infinity, maxLon = -Infinity, minLon = Infinity;
  for (const [lon, lat] of u) {
    if (lat < minLat) minLat = lat;
    if (lon > maxLon) maxLon = lon;
    if (lon < minLon) minLon = lon;
  }
  const enclosesSouthPole = minLat < -60 && (maxLon - minLon) > 180;
  const first = u[0], last = u[u.length - 1];

  for (const off of [-360, 0, 360]) {
    ctx.moveTo(...xyFn(u[0][0] + off, u[0][1]));
    for (let i = 1; i < u.length; i++) ctx.lineTo(...xyFn(u[i][0] + off, u[i][1]));
    if (enclosesSouthPole) {
      ctx.lineTo(...xyFn(last[0] + off, -90));
      ctx.lineTo(...xyFn(first[0] + off, -90));
    }
    ctx.closePath();
  }
}

function fillFeature(ctx, feature, color) {
  ctx.fillStyle = color;
  for (const poly of getPolygons(feature.geometry)) {
    ctx.beginPath();
    for (const ring of poly) pathRing(ctx, ring, toXY);
    ctx.fill('evenodd');
  }
}

function strokeFeature(ctx, feature, color, lw = 1) {
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  for (const poly of getPolygons(feature.geometry)) {
    for (const ring of poly) {
      const u = unwrapRing(ring);
      for (const off of [-360, 0, 360]) {
        ctx.beginPath();
        ctx.moveTo(...toXY(u[0][0] + off, u[0][1]));
        for (let i = 1; i < u.length; i++) ctx.lineTo(...toXY(u[i][0] + off, u[i][1]));
        ctx.stroke();
      }
    }
  }
}

function drawGlowFor(feature, color) {
  glowCtx.clearRect(0, 0, GLOW_W, GLOW_H);
  glowCtx.save();

  // 塗りつぶし + ぼかし
  glowCtx.shadowColor = color;
  glowCtx.shadowBlur = 40;
  glowCtx.fillStyle = color;
  for (const poly of getPolygons(feature.geometry)) {
    glowCtx.beginPath();
    for (const ring of poly) pathRing(glowCtx, ring, glowToXY);
    glowCtx.fill('evenodd');
  }

  // 輪郭線にも発光を重ねる
  glowCtx.strokeStyle = '#ffffff';
  glowCtx.lineWidth = 2;
  glowCtx.shadowColor = color;
  glowCtx.shadowBlur = 25;
  for (const poly of getPolygons(feature.geometry)) {
    for (const ring of poly) {
      const u = unwrapRing(ring);
      for (const off of [-360, 0, 360]) {
        glowCtx.beginPath();
        glowCtx.moveTo(...glowToXY(u[0][0] + off, u[0][1]));
        for (let i = 1; i < u.length; i++) glowCtx.lineTo(...glowToXY(u[i][0] + off, u[i][1]));
        glowCtx.stroke();
      }
    }
  }

  glowCtx.restore();
  glowTexture.needsUpdate = true;
}

// ★修正：ズーム切り替えをコサイン補間で滑らかに
function flyTo(lon, lat, duration = 1000, options = {}) {
  const { zoomOutTo: zoomOutToRaw = null, targetDist = null } = options;
  const zoomOutTo = zoomOutToRaw != null ? Math.min(zoomOutToRaw, controls.maxDistance) : null;
  return new Promise(resolve => {
    isFlying = true;
    controls.enabled = false;

    const startPos = camera.position.clone();
    const startLL = vec3ToLonLat(startPos);
    const startDist = startPos.length();
    // controls.maxDistance=6 を超えると flyTo 終了時に controls.update() で
    // クランプされてカクッと戻るため、ここで制限する。
    const finalDist = THREE.MathUtils.clamp(targetDist != null ? targetDist : startDist, controls.minDistance, controls.maxDistance);

    let dLon = lon - startLL.lon;
    while (dLon > 180) dLon -= 360;
    while (dLon < -180) dLon += 360;

    let startTime = performance.now();
    let lastNow = startTime;

    function step(now) {
      if (paused) {
        // 止まっている間は経過時間に加算しない。カメラの飛行がその場で止まる。
        startTime += now - lastNow;
        lastNow = now;
        requestAnimationFrame(step);
        return;
      }
      lastNow = now;
      const t = Math.min(1, (now - startTime) / duration);
      const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      const curLon = startLL.lon + dLon * ease;
      const curLat = startLL.lat + (lat - startLL.lat) * ease;

      let curDist;
      if (zoomOutTo != null) {
        // 前半: コサイン補間でスムーズにズームアウト
        // 後半: コサイン補間でスムーズにズームイン
        // どちらも端点で速度0になるので切り替えが滑らか
        if (t < 0.5) {
          const tt = t * 2;
          const ee = (1 - Math.cos(Math.PI * tt)) / 2;
          curDist = startDist + (zoomOutTo - startDist) * ee;
        } else {
          const tt = (t - 0.5) * 2;
          const ee = (1 - Math.cos(Math.PI * tt)) / 2;
          curDist = zoomOutTo + (finalDist - zoomOutTo) * ee;
        }
      } else {
        curDist = startDist + (finalDist - startDist) * ease;
      }

      camera.position.copy(lonLatToVec3(curLon, curLat, curDist));
      camera.lookAt(0, 0, 0);

      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        isFlying = false;
        controls.enabled = !isLocked;
        controls.update();
        resolve();
      }
    }
    requestAnimationFrame(step);
  });
}

function getCountryCenter(feature) {
  // turf.center は外接矩形の中心なので、日付変更線をまたぐ国（ロシア・
  // アメリカ・フィジー等）や海外領土を持つ国（フランス）では国土の外に
  // 飛んでしまう。面積最大のポリゴン（本土）の中の点を返す。
  try {
    const polys = getPolygons(feature.geometry);
    let best = null, bestArea = -1;
    for (const poly of polys) {
      const pf = { type: 'Feature', geometry: { type: 'Polygon', coordinates: poly }, properties: {} };
      const a = turf.area(pf);
      if (a > bestArea) { bestArea = a; best = pf; }
    }
    if (best) {
      const pt = turf.pointOnFeature(best);
      return { lon: pt.geometry.coordinates[0], lat: pt.geometry.coordinates[1] };
    }
  } catch (e) { console.warn('getCountryCenter failed', e); }
  try {
    const c = turf.center(feature);
    return { lon: c.geometry.coordinates[0], lat: c.geometry.coordinates[1] };
  } catch {
    if (feature._bbox) {
      return {
        lon: (feature._bbox[0] + feature._bbox[2]) / 2,
        lat: (feature._bbox[1] + feature._bbox[3]) / 2
      };
    }
    return { lon: 0, lat: 0 };
  }
}

function normalizeId(id) {
  if (id === undefined || id === null) return null;
  return String(id).padStart(3, '0');
}

async function loadTranslations() {
  try {
    const data = await fetch('https://cdn.jsdelivr.net/npm/world-countries@4.0.0/countries.json').then(r => r.json());
    data.forEach(c => {
      // world-countries の翻訳キーは ISO 639-2 の 'jpn'（'ja' ではない）。
      // 'ja' で引くと常に空になり、日本語名がフォールバック頼みになる。
      const ja = c.translations?.jpn?.common || c.translations?.ja?.common;
      if (c.ccn3) {
        const key = normalizeId(c.ccn3);
        if (ja) jaNames[key] = ja;
        if (c.region) regions[key] = c.region;
        if (c.subregion) subregions[key] = c.subregion;
        if (c.capital?.[0]) capitals[key] = c.capital[0];
        if (c.area != null) areas[key] = c.area;
      }
      if (c.cca3) {
        if (ja) jaNames[c.cca3] = ja;
        if (c.region) regions[c.cca3] = c.region;
        if (c.subregion) subregions[c.cca3] = c.subregion;
        if (c.capital?.[0]) capitals[c.cca3] = c.capital[0];
        if (c.area != null) areas[c.cca3] = c.area;
      }
    });
  } catch (e) {
    console.warn('翻訳データの取得に失敗しました。', e);
  }
}

function getJapaneseName(feature) {
  if (!feature) return '';
  const name = feature.properties?.name;
  // Atlas名でのフォールバックを最優先する。idだけだと Ashmore諸島(id=036) が
  // オーストラリアと同一idのため「オーストラリア」と表示されてしまう。
  if (name && FALLBACK_JA[name]) return FALLBACK_JA[name];
  const idKey = normalizeId(feature.id);
  if (idKey && jaNames[idKey]) return jaNames[idKey];
  if (feature.properties?.iso_a3 && jaNames[feature.properties.iso_a3]) return jaNames[feature.properties.iso_a3];
  return name || '不明な国';
}

function drawBaseMap() {
  baseCtx.fillStyle = COLORS.ocean;
  baseCtx.fillRect(0, 0, MAP_W, MAP_H);

  for (const f of countries.features) if (f.geometry) fillFeature(baseCtx, f, COLORS.land);

  const lw = Math.max(1, MAP_W / 4096);
  for (const f of countries.features) if (f.geometry) strokeFeature(baseCtx, f, COLORS.border, lw);
}

function redrawMap() {
  mapCtx.clearRect(0, 0, MAP_W, MAP_H);
  mapCtx.drawImage(baseCanvas, 0, 0);

  const lw = Math.max(1, MAP_W / 4096);
  for (const f of wrongMarks) {
    fillFeature(mapCtx, f, COLORS.wrong);
    strokeFeature(mapCtx, f, COLORS.border, lw);
  }
  if (correctMark) {
    fillFeature(mapCtx, correctMark, COLORS.correct);
    strokeFeature(mapCtx, correctMark, COLORS.border, lw);
  }

  mapTexture.needsUpdate = true;
}

function findCountry(lon, lat) {
  // 日付変更線をまたぐ国はポリゴンが180度で切れているため、lon±360の
  // 等価な点でも判定する（ロシア東端やフィジー東端の数km分の取りこぼし対策）。
  for (const off of [0, 360, -360]) {
    const testLon = lon + off;
    const pt = turf.point([testLon, lat]);
    for (const f of countries.features) {
      const b = f._bbox;
      if (b && (testLon < b[0] - 0.5 || testLon > b[2] + 0.5 || lat < b[1] - 0.5 || lat > b[3] + 0.5)) continue;
      try { if (turf.booleanPointInPolygon(pt, f)) return f; } catch {}
    }
  }
  return null;
}

// 飛行など、すべての待ち時間がこれを通るため、止めると全体が止まる。
const sleep = ms => new Promise(resolve => {
  let remaining = ms;
  let last = performance.now();
  const id = setInterval(() => {
    if (paused) { last = performance.now(); return; }
    const now = performance.now();
    remaining -= now - last;
    last = now;
    if (remaining <= 0) { clearInterval(id); resolve(); }
  }, 50);
});

  const mb = document.getElementById('menu-best-streak');
  if (mb) mb.textContent = bestStreak;
}
function beep(freq, dur = 0.12, type = 'sine', delay = 0) {
  if (!soundEnabled) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  } catch {}
}
function playCorrect() { beep(660, 0.12); beep(880, 0.18, 'sine', 0.1); }
function playWrong() { beep(160, 0.25, 'sawtooth'); }
function flash(color) {
  const el = document.getElementById('flash');
  el.style.background = color; el.classList.add('show');
  sleep(320).then(() => el.classList.remove('show'));
}
function shakeScreen() {
  document.body.classList.add('shake');
  sleep(420).then(() => document.body.classList.remove('shake'));
}
function countryScreenPos(feature) {
  const c = getCountryCenter(feature);
  const v = lonLatToVec3(c.lon, c.lat, R * 1.02);
  v.project(camera);
  if (v.z > 1) return null;
  return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight };
}
function burstFromCountry(feature) {
  const pos = countryScreenPos(feature) || { x: innerWidth / 2, y: innerHeight / 2 };
  const box = document.getElementById('confetti');
  const ring = document.createElement('div');
  ring.className = 'burst-ring';
  ring.style.left = pos.x + 'px';
  ring.style.top = pos.y + 'px';
  box.appendChild(ring);
  sleep(900).then(() => ring.remove());
  const colors = ['#4ade80', '#60a5fa', '#fbbf24', '#f472b6', '#a78bfa', '#ffffff'];
  for (let i = 0; i < 36; i++) {
    const d = document.createElement('div');
    d.className = 'burst-piece';
    const ang = Math.random() * Math.PI * 2;
    const dist = 50 + Math.random() * 110;
    d.style.left = pos.x + 'px';
    d.style.top = pos.y + 'px';
    d.style.background = colors[i % colors.length];
    d.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    d.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    box.appendChild(d);
    sleep(1000).then(() => d.remove());
  }
}
let toastTimer = null;
function showToast(text) {
  const el = document.getElementById('toast');
  el.textContent = text; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}
function getCountryInfo(feature) {
  const idKey = normalizeId(feature.id);
  const capital = capitals[idKey] || capitals[feature.properties?.iso_a3] || null;
  const area = areas[idKey] ?? areas[feature.properties?.iso_a3];
  const regionJa = getRegionHint(feature) || '—';
  return {
    capital,
    regionJa,
    area: area == null ? '—' : Math.round(area).toLocaleString() + ' km²',
  };
}
function showInfoCard(feature, label) {
  const info = getCountryInfo(feature);
  const el = document.getElementById('info-card');
  el.innerHTML = `<div class="info-label">${label}</div><div class="info-name">${getJapaneseName(feature)}</div><div class="info-rows"><div><span>首都</span><b>${info.capital || '—'}</b></div><div><span>地域</span><b>${info.regionJa}</b></div><div><span>面積</span><b>${info.area}</b></div></div>`;
  el.classList.add('show');
}
function hideInfoCard() { document.getElementById('info-card').classList.remove('show'); }
function pauseGame() {
  // アニメーション中（表示・ヒント・フィードバック）でも押せる。
  if (state === 'menu' || state === 'error' || state === 'paused') return;
  paused = true;
  document.body.classList.add('paused');
  pausedFromState = state;
  pauseTimer(); setLock(true); state = 'paused';
  document.getElementById('pause-overlay').classList.add('show');
}
function resumeGame() {
  if (state !== 'paused') return;
  paused = false;
  document.body.classList.remove('paused');
  document.getElementById('pause-overlay').classList.remove('show');
  state = pausedFromState || 'playing'; pausedFromState = null;
  setLock(false);
  // プレイ中だった場合だけタイマーを再開する。表示・ヒント・フィードバック中は
  // もともとタイマーが止まっているので、再開はその流れに任せる。
  if (state === 'playing') startTimer();
}
function returnToMenu() {
  sessionId++;
  paused = false;
  document.body.classList.remove('paused');
  pauseTimer();
  hideInfoCard(); hideCenterMsg();
  document.getElementById('pause-overlay').classList.remove('show');
  resetColors(); stopGlow();
  score = 0; total = 0; streak = 0; bestStreak = 0; attemptCounted = false;
  setScore();
  $menu.classList.remove('hidden');
  setMenuMode(true);
  state = 'menu';
  updateStatsUI();
}

async function restartGame() {
  sessionId++;
  paused = false;
  document.body.classList.remove('paused');
  pauseTimer();
  hideInfoCard(); hideCenterMsg();
  document.getElementById('pause-overlay').classList.remove('show');
  score = 0; total = 0; streak = 0; bestStreak = 0; attemptCounted = false;
  setScore(); resetColors(); stopGlow();
  const sid = sessionId;
  // 少しだけズームアウトして、全体を見渡せる位置から次の問題へ。
  // すでに飛行中の場合はそちらに任せ、競合しないよう飛ばない。
  if (!isFlying) {
    state = 'restarting';
    setLock(true);
    const curPos = camera.position.clone();
    const curLL = vec3ToLonLat(curPos);
    const curDist = curPos.length();
    if (curDist < 3.1) {
      await flyTo(curLL.lon, curLL.lat, 800, { targetDist: Math.min(curDist + 0.9, 3.2) });
      if (sid !== sessionId) return;
    }
  }
  state = 'menu';
  startQuestion();
}

function setLock(lock) {
  isLocked = lock;
  if (!isFlying) controls.enabled = !lock;
}

function startTimer() {
  if (timerRunning) return;
  timerRunning = true;
  lastTick = performance.now();
  timerId = requestAnimationFrame(timerLoop);
}

function pauseTimer() {
  timerRunning = false;
  if (timerId) cancelAnimationFrame(timerId);
  timerId = null;
}

function timerLoop(now) {
  if (!timerRunning) return;
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  timeLeft = Math.max(0, timeLeft - dt);
  updateGauge();

  if (timeLeft <= 0) {
    pauseTimer();
    onTimeUp();
    return;
  }

  if (!hint1Shown && timeLeft <= 20) {
    hint1Shown = true;
    try { showHint(getHemisphereHint(target)).catch(e => console.warn('hint failed', e)); }
    catch (e) { console.warn('hint failed', e); }
  } else if (!hint2Shown && timeLeft <= 10) {
    hint2Shown = true;
    try {
      const hint = getRegionHint(target);
      if (hint) showHint(hint).catch(e => console.warn('hint failed', e));
    } catch (e) { console.warn('hint failed', e); }
  }

  if (timerRunning) timerId = requestAnimationFrame(timerLoop);
}

function updateGauge() {
  const pct = timeLeft / 30;
  const t = document.getElementById('time-text');
  if (t) t.textContent = Math.ceil(timeLeft);
  timeGaugeWrap.classList.toggle('low', timeLeft <= 10);
  timeGauge.style.transform = `scaleX(${pct})`;
  if (timeLeft > 20) timeGauge.style.background = '#4ade80';
  else if (timeLeft > 10) timeGauge.style.background = '#fbbf24';
  else timeGauge.style.background = '#f87171';
}

function showCenterMsg(text, color) {
  centerMsg.textContent = text;
  centerMsg.style.color = color;
  centerMsg.classList.add('show');
}

function hideCenterMsg() {
  centerMsg.classList.remove('show');
}

function getHemisphereHint(feature) {
  if (!feature._bbox) return '北半球';
  const centerLat = (feature._bbox[1] + feature._bbox[3]) / 2;
  if (centerLat > 10) return '北半球';
  if (centerLat < -10) return '南半球';
  return '赤道付近';
}

function getRegionHint(feature) {
  const idKey = normalizeId(feature.id);
  // subregion があればそれを優先する。緯度12度で南北を分ける旧方式では
  // パナマやコスタリカ（緯度約9度）が「南アメリカ」になってしまう。
  const sub = subregions[idKey] || subregions[feature.properties?.iso_a3];
  const subMap = {
    'Northern America': '北アメリカ', 'North America': '北アメリカ',
    'South America': '南アメリカ', 'Central America': '中央アメリカ',
    'Caribbean': 'カリブ海',
  };
  if (sub && subMap[sub]) return subMap[sub];
  let region = regions[idKey] || regions[feature.properties?.iso_a3];
  // 地域不明のときに「アジア」と嘘のヒントを出すのはやめ、ヒントなしにする。
  if (!region) return null;
  const map = {
    'Africa': 'アフリカ', 'Americas': 'アメリカ大陸', 'Asia': 'アジア',
    'Europe': 'ヨーロッパ', 'Oceania': 'オセアニア', 'Antarctic': '南極',
  };
  if (region === 'Americas') {
    if (!feature._bbox) return 'アメリカ大陸';
    const centerLat = (feature._bbox[1] + feature._bbox[3]) / 2;
    return centerLat > 12 ? '北アメリカ' : '南アメリカ';
  }
  return map[region] || region;
}

async function showHint(text) {
  const sid = sessionId;
  pauseTimer();
  setLock(true);
  state = 'hint';

  timeGaugeWrap.classList.remove('active');

  hintText.textContent = `ヒント: ${text}`;
  hintText.classList.add('no-transition');
  hintText.classList.remove('corner');
  hintText.classList.add('center');
  void hintText.offsetWidth;
  hintText.classList.remove('no-transition');

  await sleep(2000);
  if (sid !== sessionId) return;

  hintText.classList.remove('center');
  hintText.classList.add('corner');

  await sleep(600);
  if (sid !== sessionId) return;

  timeGaugeWrap.classList.add('active');
  setLock(false);
  state = 'playing';
  startTimer();
}

function resetColors() {
  wrongMarks.clear();
  correctMark = null;
  redrawMap();
}

function pickTarget() {
  const list = countries.features.filter(f => f.geometry && f.properties?.name !== 'Antarctica' && !NON_COUNTRY_TARGETS.has(f.properties?.name));
  target = list[Math.floor(Math.random() * list.length)];
}

async function startQuestion() {
  if (!countries) return;
  const sid = sessionId;
  hideInfoCard();
  state = 'showing';
  setLock(true);
  resetColors();
  stopGlow();
  pickTarget();

  timeGaugeWrap.classList.remove('active');
  attemptCounted = false;
  timeLeft = 30;
  hint1Shown = false;
  hint2Shown = false;
  updateGauge();

  hintText.className = 'announce-style';
  hintText.textContent = '';

  const targetNameJa = getJapaneseName(target);
  questionTitle.textContent = targetNameJa;
  // 長い国名が画面からはみ出さないよう、文字数でフォントを絞る。
  questionTitle.style.fontSize = targetNameJa.length > 12 ? 'clamp(1.1rem, 3vw, 2rem)'
    : targetNameJa.length > 8 ? 'clamp(1.4rem, 4vw, 2.8rem)' : '';
  questionTitle.classList.add('no-transition');
  questionTitle.classList.remove('corner');
  questionTitle.classList.add('center');
  void questionTitle.offsetWidth;
  questionTitle.classList.remove('no-transition');

  await sleep(3000);
  if (sid !== sessionId) return;

  questionTitle.classList.remove('center');
  questionTitle.classList.add('corner');

  await sleep(600);
  if (sid !== sessionId) return;

  timeGaugeWrap.classList.add('active');
  setLock(false);
  state = 'playing';
  startTimer();
}

async function showCorrect() {
  const sid = sessionId;
  pauseTimer();
  setLock(true);
  state = 'feedback';
  streak++;
  if (streak > bestStreak) { bestStreak = streak; }
  setScore();

  timeGaugeWrap.classList.remove('active');
  correctMark = target;
  redrawMap();
  startGlow(target, '#22c55e');
  playCorrect(); burstFromCountry(target); flash('#22c55e');
  showCenterMsg(streak >= 2 ? `正解！ ${streak}連続！` : '正解！', '#4ade80');
  showInfoCard(target, '正解');
  await sleep(1500);
  if (sid !== sessionId) return;
  hideCenterMsg();

  const curPos = camera.position.clone();
  const curLL = vec3ToLonLat(curPos);
  const curDist = curPos.length();
  await flyTo(curLL.lon, curLL.lat, 1000, { targetDist: curDist * 1.3 });

  stopGlow();
  correctMark = null;
  redrawMap();
  await sleep(300);
  if (sid !== sessionId) return;

  startQuestion();
}

async function showWrong(picked) {
  const sid = sessionId;
  pauseTimer();
  setLock(true);
  state = 'feedback';
  streak = 0; setScore();
  playWrong(); shakeScreen(); flash('#ef4444');
  wrongMarks.add(picked);
  redrawMap();

  timeLeft = Math.max(0, timeLeft - 5);
  timeGauge.style.transition = 'transform 0.5s ease-out';
  updateGauge();
  setTimeout(() => { timeGauge.style.transition = ''; }, 600);

  showCenterMsg(`ここは ${getJapaneseName(picked)} です`, '#f87171');
  showInfoCard(picked, '不正解 — ここは');
  await sleep(3000);
  if (sid !== sessionId) return;
  hideCenterMsg(); hideInfoCard();

  wrongMarks.delete(picked);
  redrawMap();
  await sleep(400);
  if (sid !== sessionId) return;

  if (timeLeft <= 0) {
    onTimeUp();
    return;
  }

  setLock(false);
  state = 'playing';
  startTimer();
}

async function onTimeUp() {
  const sid = sessionId;
  pauseTimer();
  setLock(true);
  state = 'feedback';
  streak = 0; setScore();
  playWrong(); flash('#ef4444');
  if (!attemptCounted) {
    attemptCounted = true;
    total++;
    setScore();
  }

  timeGaugeWrap.classList.remove('active');
  wrongMarks.clear();
  redrawMap();

  showCenterMsg('時間切れ！', '#f87171');
  showInfoCard(target, '時間切れ — 正解は');
  await sleep(2000);
  if (sid !== sessionId) return;
  hideCenterMsg();

  correctMark = target;
  redrawMap();

  // ★グロー開始（金色）
  startGlow(target, '#ffd700');

  const center = getCountryCenter(target);
  await flyTo(center.lon, center.lat, 5000, {
    zoomOutTo: 5.5,
    targetDist: 2.0
  });

  await sleep(5000);
  if (sid !== sessionId) return;

  // その場で少しズームアウト（グローは継続）
  const curPos = camera.position.clone();
  const curLL = vec3ToLonLat(curPos);
  const curDist = curPos.length();
  await flyTo(curLL.lon, curLL.lat, 1000, { targetDist: curDist * 1.3 });

  stopGlow();
  correctMark = null;
  redrawMap();
  await sleep(300);
  if (sid !== sessionId) return;
  hideInfoCard();

  startQuestion();
}

async function init() {
  try {
    await loadTranslations();

    const res = await fetch(
      'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json',
      { signal: AbortSignal.timeout(20000) }
    );
    if (!res.ok) throw new Error(`world-atlas fetch failed: ${res.status}`);
    const topology = await res.json();
    countries = topojson.feature(topology, topology.objects.countries);

  countries.features.forEach(f => {
    if (!f.geometry) return;
    try { f._bbox = turf.bbox(f); } catch { f._bbox = null; }
  });

  drawBaseMap();
  redrawMap();
  setScore();

  $menu.innerHTML = `
    <div class="menu-inner">
      <div class="menu-eyebrow">World Geography</div>
      <h1>GEO <span>QUIZ</span></h1>
      <p class="menu-sub">地球儀を回して、表示された国を探すクイズです。</p>
      <div class="howto">
        <div><span class="step-no">01</span><p>国名が画面に表示されます</p></div>
        <div><span class="step-no">02</span><p>地球儀をドラッグして回します</p></div>
        <div><span class="step-no">03</span><p>その国をタップします。制限時間は30秒です</p></div>
      </div>
      <div class="menu-foot">
        <button class="menu-btn" type="button">スタート</button>
        <div class="menu-meta">
          <div class="menu-best">ベスト連続正解 <span id="menu-best-streak">${bestStreak}</span>連続</div>
          <div class="start-text">ENTERキーでも開始できます</div>
        </div>
      </div>
    </div>
  `;
  $menu.classList.remove('hidden');
  setMenuMode(true);
  state = 'menu';
  updateStatsUI();
  return true;
  } catch (e) {
    console.error('init failed', e);
    // 取得失敗で LOADING のまま固まらないよう、再試行できる表示にする。
    $menu.innerHTML = `
      <h1>GEO QUIZ</h1>
      <div class="start-text">読み込みに失敗しました</div>
      <div class="loading">タップ / ENTER で再試行</div>
    `;
    $menu.classList.remove('hidden');
    setMenuMode(true);
    state = 'error';
    return false;
  }
}

function retryInit() {
  $menu.innerHTML = '<div class="loading">LOADING...</div>';
  init().then(started => { if (started) animate(); });
}

async function startGame() {
  if (state !== 'menu') return;
  paused = false;
  document.body.classList.remove('paused');
  setMenuMode(false);
  $menu.classList.add('hidden');
  await sleep(800);
  startQuestion();
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function tapToLonLat(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(globe);
  if (!hits.length) return null;
  return vec3ToLonLat(hits[0].point);
}

let downPos = null;
let downPointerId = null;
renderer.domElement.addEventListener('pointerdown', e => {
  // 2本目の指（ピンチ中）はタップにしない。
  if (downPos !== null) { downPos = null; downPointerId = null; return; }
  downPos = { x: e.clientX, y: e.clientY };
  downPointerId = e.pointerId;
});
renderer.domElement.addEventListener('pointercancel', e => {
  if (e.pointerId === downPointerId) { downPos = null; downPointerId = null; }
});
renderer.domElement.addEventListener('pointerup', e => {
  if (state !== 'playing' || isLocked) return;
  if (!downPos || e.pointerId !== downPointerId) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  downPointerId = null;
  if (moved > 6) return;

  const hit = tapToLonLat(e);
  if (!hit) return;

  const picked = findCountry(hit.lon, hit.lat);
  if (!picked) {
    showToast('海の上です — 陸をタップしてね');
    return;
  }

  total++;
  attemptCounted = true;
  if (picked === target) {
    score++;
    setScore();
    showCorrect();
  } else {
    setScore();
    showWrong(picked);
  }
});

window.addEventListener('keydown', e => {
  if (e.key === 'Enter' && state === 'menu') startGame();
  else if (e.key === 'Enter' && state === 'error') retryInit();
});
$menu.addEventListener('click', () => {
  if (state === 'menu') startGame();
  else if (state === 'error') retryInit();
});

document.getElementById('btn-pause').addEventListener('click', e => { e.stopPropagation(); pauseGame(); });
document.getElementById('btn-restart').addEventListener('click', e => { e.stopPropagation(); if (state === 'playing' || state === 'paused') restartGame(); else if (state === 'menu') startGame(); });
document.getElementById('btn-resume').addEventListener('click', e => { e.stopPropagation(); resumeGame(); });
document.getElementById('btn-restart-overlay').addEventListener('click', e => { e.stopPropagation(); restartGame(); });
document.getElementById('btn-menu-overlay').addEventListener('click', e => { e.stopPropagation(); returnToMenu(); });
document.getElementById('btn-sound').addEventListener('click', e => {
  e.stopPropagation();
  soundEnabled = !soundEnabled;
  localStorage.setItem('geoQuizSound', soundEnabled ? 'on' : 'off');
  e.currentTarget.classList.toggle('muted', !soundEnabled);
});
document.getElementById('btn-sound').classList.toggle('muted', !soundEnabled);
updateStatsUI();

const UP_AXIS = new THREE.Vector3(0, 1, 0);
function animate() {
  requestAnimationFrame(animate);
  // 一時停止中はここで止める。メニューの回転・グロー・描画すべてが止まる。
  if (paused) return;
  if ((state === 'menu' || state === 'error') && !isFlying) {
    camera.position.applyAxisAngle(UP_AXIS, 0.0012);
    camera.lookAt(0, 0, 0);
  }
  // 地球の画面上の見かけの大きさに合わせて回転感度を補正する。
  // ズームインして地球が大きく表示されるほど、同じスワイプ量での回転角を小さくする。
  // 透視投影での見かけの半径に基づくため、ズーム倍率に対して自然に追従する。
  const distance = camera.position.length();
  const apparentRadius = d => 1 / Math.sqrt(d * d - R * R);
  const sensitivity = apparentRadius(BASE_CAMERA_DISTANCE) / apparentRadius(distance);
  controls.rotateSpeed = BASE_ROTATE_SPEED * sensitivity;

  if (!isFlying) controls.update();

  // ★グローのパルスアニメーション
  if (glowActive) {
    const t = (performance.now() - glowStartTime) / 1000;
    const pulse = 0.5 + 0.5 * Math.sin(t * Math.PI * 2);
    glowMaterial.opacity = 0.5 + pulse * 0.5;
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

init().then(started => { if (started) animate(); });
</script>
